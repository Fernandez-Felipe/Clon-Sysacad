services:
  Sysacad:
    image: mysql:8.0
    container_name: db-sysacad
    environment:
      - 'MYSQL_ROOT_PASSWORD=123456789'
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - Sysacad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Sysacad:3306/alumnos-sysacad
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
    ports:
      - "8080:8080"

  materias-inscriptions-service:
    build: ./MateriasInscription-service
    container_name: materias-inscriptions-service
    depends_on:
      - auth-service
      - Sysacad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Sysacad:3306/inscripciones-materias
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
    ports:
      - "8081:8081"

  exams-inscriptions-service:
    build: ./ExamInscription-service
    container_name: exams-inscriptions-service
    depends_on:
      - auth-service
      - Sysacad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Sysacad:3306/inscripciones-examenes
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
    ports:
      - "8082:8082"

  materias-service:
    build: ./materias-service
    container_name: materias-service
    depends_on:
      - auth-service
      - Sysacad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Sysacad:3306/materias
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
    ports:
      - "8083:8083"

  carreras-service:
    build: ./carreras-service
    container_name: carreras-service
    depends_on:
      - auth-service
      - Sysacad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Sysacad:3306/carreras
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
    ports:
      - "8084:8084"